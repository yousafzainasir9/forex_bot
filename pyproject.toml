[project]
name = "forex-bot"
version = "0.1.0"
description = "Transparent M15 EMA/RSI/ATR forex trading bot for MetaTrader 5 (DEMO-first)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "flask>=3.0",
    # MetaTrader5 only installs on Windows with the MT5 terminal present.
    "MetaTrader5>=5.0.45 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
